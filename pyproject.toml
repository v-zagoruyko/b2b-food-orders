[project]
name = "b2b-food-orders"
version = "0.1.0"
description = "Заказы торговых точек для небольших производств еды"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.0,<7",
    "django-environ>=0.13.0",
    "django-simple-history>=3.11.0",
    "django-viewflow>=2.2.15",
    "gunicorn>=26.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "pytest>=8.3",
    "pytest-cov>=6.1",
    "pytest-django>=4.9",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
addopts = "--cov --cov-report=term-missing"
